name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: vems
          POSTGRES_DB: vems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VEMS_TEST_POSTGRES_URL: postgresql://postgres:vems@localhost:5432/vems_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Vtiger mirror guard event handler source tests
        run: |
          sudo mkdir -p /opt/vems
          sudo cp infra/services/vtiger/development/MirrorGuard.php infra/services/vtiger/development/MirrorGuardHandler.php infra/services/vtiger/development/ImportGuard.php infra/services/vtiger/development/install-mirror-guard.php infra/services/vtiger/field-ownership.json /opt/vems/
          for file in MirrorGuard.php MirrorGuardHandler.php ImportGuard.php install-mirror-guard.php; do php -l "infra/services/vtiger/development/$file"; done
          php infra/services/vtiger/mirror-guard.test.php
      - name: Vtiger provisioner syntax check
        run: |
          for file in provision-development.php provision-audit-roles.php; do php -l "infra/services/vtiger/development/$file"; done
      - run: npm test
