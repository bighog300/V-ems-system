<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V-EMS Web Control - Dispatcher Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>VEMS Dispatcher Control Board</h1>
      <p class="hint">Board-first dispatch experience with urgency grouping, KPI visibility, and quick incident review actions.</p>


      <section class="panel controls" aria-label="Authentication and API">
        <label>
          API Base URL
          <input id="apiBaseUrl" value="http://127.0.0.1:8080" />
        </label>
        <label>
          Bearer Token
          <input id="authToken" type="password" autocomplete="off" placeholder="Paste JWT/OAuth bearer token" />
        </label>
        <details data-dev-only>
          <summary>Development identity headers</summary>
        <label>
          Actor ID
          <input id="actorId" value="STAFF-001" />
        </label>
        <label>
          Actor Role
          <select id="actorRole">
            <option value="dispatcher">dispatcher</option>
            <option value="field_crew">field_crew</option>
            <option value="field_crew_lead">field_crew_lead</option>
            <option value="clinical_reviewer">clinical_reviewer</option>
            <option value="supervisor">supervisor</option>
            <option value="sys_admin">sys_admin</option>
          </select>
        </label>
        </details>
        <button id="loadDispatcherBoard">Open Dispatcher Board</button>
        <button id="loadBoard">Load Crew Job List</button>
      </section>

      <section class="panel" aria-labelledby="callIntakeHeading">
        <h2 id="callIntakeHeading">New call / incident</h2>
        <form id="callIntakeForm">
          <div class="controls">
            <label>Call source
              <select name="call_source" required>
                <option value="phone">Phone</option><option value="radio">Radio</option>
                <option value="walk_in">Walk-in</option><option value="transfer">Transfer</option><option value="other">Other</option>
              </select>
            </label>
            <label>Received at (local time)<input id="callIntakeReceivedAt" name="received_at" type="datetime-local" required /></label>
            <label>Category
              <select name="category" required>
                <option value="medical_emergency">Medical emergency</option><option value="trauma">Trauma</option>
                <option value="cardiac">Cardiac</option><option value="respiratory">Respiratory</option>
                <option value="maternity">Maternity</option><option value="psychiatric">Psychiatric</option>
                <option value="standby">Standby</option><option value="other">Other</option>
              </select>
            </label>
            <label>Priority
              <select name="priority" required>
                <option value="critical">Critical</option><option value="high">High</option>
                <option value="medium">Medium</option><option value="low">Low</option>
              </select>
            </label>
            <label>Patient count<input name="patient_count" type="number" min="0" step="1" value="1" required /></label>
            <label>Address<input name="address" required /></label>
          </div>
          <label>Description<textarea name="description" rows="3" required></textarea></label>
          <button id="createIncidentAction" type="submit">Create incident</button>
          <p id="callIntakeFeedback" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel controls">
        <label>
          Active Only
          <input id="boardFilterActive" type="checkbox" />
        </label>
        <label>
          Status
          <select id="boardFilterStatus">
            <option value="all">All statuses</option>
            <option value="Awaiting Dispatch">Awaiting Dispatch</option>
            <option value="Assigned">Assigned</option>
            <option value="Crew Acknowledged">Crew Acknowledged</option>
            <option value="En Route">En Route</option>
            <option value="On Scene">On Scene</option>
            <option value="Transporting">Transporting</option>
            <option value="At Destination">At Destination</option>
            <option value="Handover Complete">Handover Complete</option>
            <option value="Closed">Closed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Stood Down">Stood Down</option>
          </select>
        </label>
        <label>
          Priority
          <select id="boardFilterPriority">
            <option value="all">All priorities</option>
            <option value="critical">critical</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
        </label>
        <label>
          Sort
          <select id="boardSortBy">
            <option value="priority">Priority</option>
            <option value="recency">Recency</option>
          </select>
        </label>
        <label>
          Auto Refresh (15s)
          <input id="boardAutoRefresh" type="checkbox" checked />
        </label>
      </section>

      <section class="panel controls">
        <label>
          Incident ID
          <input id="incidentId" placeholder="INC-000001" />
        </label>
        <button id="loadCrewIncident">Load Crew Incident Detail</button>
        <button id="loadIncident">Load Operational Summary</button>
      </section>

      <p id="status" aria-live="polite"></p>
      <div id="dispatcherBoardOutput" role="region" aria-label="Dispatcher board"></div>
      <div id="crewJobOutput" role="region" aria-label="Crew job list"></div>
      <div id="crewIncidentOutput" role="region" aria-label="Crew incident detail"></div>
      <div id="incidentOutput" role="region" aria-label="Operational summary"></div>
    </main>

    <script type="module" src="./main.mjs"></script>
  </body>
</html>
