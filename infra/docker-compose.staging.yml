services:
  # Stage 12 milestone 12h: mysql/redis were referenced by vtiger/openemr's
  # depends_on below but never actually defined in this file, and the file
  # had no top-level services:/networks:/volumes: keys either -- so
  # `docker-compose -f infra/docker-compose.staging.yml up -d` (as
  # scripts/start-env.sh runs it for staging) could never have worked as a
  # standalone compose file. Both are fixed here.
  mysql:
    image: mysql:8.0
    container_name: vems-mysql-staging
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_data_staging:/var/lib/mysql
      # Pre-existing gap, not addressed by this change: init-databases.sql
      # creates the vtiger/openemr/vems MySQL users with hardcoded
      # passwords ('vtigerpass'/'openemrpass'/'vemspass'), which only
      # happen to match dev's own compose defaults. Staging's
      # VTIGER_DB_PASSWORD/OPENEMR_DB_PASSWORD below are required with no
      # default and MUST currently be set to those same hardcoded values
      # for the vtiger/openemr containers to actually authenticate --
      # templating this init script to use the real configured passwords
      # is follow-up work, not part of Stage 12 milestone 12h.
      - ./services/mysql/init-scripts:/docker-entrypoint-initdb.d:ro
    # Unlike dev, staging does not publish MySQL's port to the host --
    # it's reachable only from other containers on vems-network-staging.
    networks:
      - vems-network-staging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: vems-redis-staging
    restart: unless-stopped
    volumes:
      - redis_data_staging:/data
    networks:
      - vems-network-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vtiger:
    build:
      context: ./services/vtiger
      dockerfile: Dockerfile
    container_name: vems-vtiger-staging
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: 3306
      DB_USER: ${VTIGER_DB_USER:-vtiger}
      DB_PASSWORD: ${VTIGER_DB_PASSWORD:?VTIGER_DB_PASSWORD is required}
      DB_NAME: ${VTIGER_DB_NAME:-vtiger}
      VTIGER_ADMIN_USER: ${VTIGER_ADMIN_USER:-admin}
      VTIGER_ADMIN_PASSWORD: ${VTIGER_ADMIN_PASSWORD:?VTIGER_ADMIN_PASSWORD is required}
      VTIGER_SITE_URL: ${VTIGER_SITE_URL_STAGING:-http://localhost:8082}
      RBAC_ENFORCE: "true"
    volumes:
      - vtiger_data_staging:/var/www/html
    networks:
      - vems-network-staging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openemr:
    build:
      context: ./services/openemr
      dockerfile: Dockerfile
    container_name: vems-openemr-staging
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:80"
    environment:
      MYSQL_HOST: ${DB_HOST:-mysql}
      MYSQL_PORT: 3306
      MYSQL_USER: ${OPENEMR_DB_USER:-openemr}
      MYSQL_PASSWORD: ${OPENEMR_DB_PASSWORD:?OPENEMR_DB_PASSWORD is required}
      MYSQL_DATABASE: ${OPENEMR_DB_NAME:-openemr}
      OPENEMR_ADMIN_USER: ${OPENEMR_ADMIN_USER:-admin}
      OPENEMR_ADMIN_PASSWORD: ${OPENEMR_ADMIN_PASSWORD:?OPENEMR_ADMIN_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RBAC_ENFORCE: "true"
    volumes:
      - openemr_data_staging:/var/www/localhost/htdocs/openemr
    networks:
      - vems-network-staging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vems-network-staging:

volumes:
  mysql_data_staging:
  redis_data_staging:
  vtiger_data_staging:
  openemr_data_staging:
